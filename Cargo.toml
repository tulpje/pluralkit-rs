[package]
name = "pluralkit-rs"
version = "0.1.0"
edition = "2024"
description = "an async pluralkit api client"
license = "CC-BY-NC-SA-4.0"

[features]
default = []
sqlx = ["dep:sqlx"]

[dependencies]
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.0", optional = true, features = ["uuid", "postgres", "mysql", "sqlite"] }
tokio = { version = "1.53.1", features = ["time", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros"] }
sqlx = { version = " 0.8.0" , features = ["runtime-tokio"] }
http = "1.1"
mock_instant = "0.6.1"
